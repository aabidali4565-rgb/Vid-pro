name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Create project files
        run: |
          mkdir -p .
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MyEditor"
          include(":app")
          EOF_FILE
          mkdir -p .
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          mkdir -p .
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF_FILE
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          
          android {
              namespace = "com.myeditor.app"
              compileSdk = 34
          
              defaultConfig {
                  applicationId = "com.myeditor.app"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "0.1"
              }
          
              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
          }
          
          dependencies {
              val media3 = "1.4.1"
              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.3")
          
              implementation("androidx.media3:media3-exoplayer:$media3")
              implementation("androidx.media3:media3-ui:$media3")
              implementation("androidx.media3:media3-transformer:$media3")
              implementation("androidx.media3:media3-effect:$media3")
              implementation("androidx.media3:media3-common:$media3")
          
              implementation("io.coil-kt:coil-compose:2.6.0")
              implementation("io.coil-kt:coil-video:2.6.0")
          }
          EOF_FILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          
              <application
                  android:label="My Editor"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p app/src/main/java/com/myeditor/app
          cat > app/src/main/java/com/myeditor/app/Models.kt <<'EOF_FILE'
          package com.myeditor.app
          
          import android.net.Uri
          
          data class Clip(
              val id: Long,
              val uri: Uri,
              val isImage: Boolean,
              val startMs: Long,
              val endMs: Long,
              val durationMs: Long,
              val speed: Float = 1f
          )
          
          sealed interface ExportState {
              object Idle : ExportState
              object Running : ExportState
              data class Done(val uri: Uri) : ExportState
              data class Error(val msg: String) : ExportState
          }
          EOF_FILE
          mkdir -p app/src/main/java/com/myeditor/app
          cat > app/src/main/java/com/myeditor/app/EditorViewModel.kt <<'EOF_FILE'
          @file:OptIn(UnstableApi::class)
          
          package com.myeditor.app
          
          import android.app.Application
          import android.content.ContentValues
          import android.media.MediaMetadataRetriever
          import android.net.Uri
          import android.provider.MediaStore
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import androidx.lifecycle.AndroidViewModel
          import androidx.lifecycle.viewModelScope
          import androidx.media3.common.Effect
          import androidx.media3.common.MediaItem
          import androidx.media3.common.MimeTypes
          import androidx.media3.common.audio.AudioProcessor
          import androidx.media3.common.audio.SonicAudioProcessor
          import androidx.media3.common.util.UnstableApi
          import androidx.media3.effect.Presentation
          import androidx.media3.effect.SpeedChangeEffect
          import androidx.media3.transformer.Composition
          import androidx.media3.transformer.EditedMediaItem
          import androidx.media3.transformer.EditedMediaItemSequence
          import androidx.media3.transformer.Effects
          import androidx.media3.transformer.ExportException
          import androidx.media3.transformer.ExportResult
          import androidx.media3.transformer.Transformer
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import java.io.File
          
          class EditorViewModel(app: Application) : AndroidViewModel(app) {
          
              var clips by mutableStateOf(listOf<Clip>())
                  private set
              var selectedId by mutableStateOf<Long?>(null)
                  private set
              var exportState by mutableStateOf<ExportState>(ExportState.Idle)
                  private set
          
              private var nextId = 1L
          
              val selected: Clip? get() = clips.firstOrNull { it.id == selectedId }
          
              fun select(id: Long) { selectedId = id }
          
              fun addMedia(uris: List<Uri>) {
                  val ctx = getApplication<Application>()
                  viewModelScope.launch {
                      for (uri in uris) {
                          val type = ctx.contentResolver.getType(uri) ?: ""
                          val isImage = type.startsWith("image")
                          val dur = if (isImage) 10_000L else withContext(Dispatchers.IO) { videoDuration(uri) }
                          val end = if (isImage) 3_000L else dur
                          val clip = Clip(nextId++, uri, isImage, 0L, end, dur.coerceAtLeast(1000L))
                          clips = clips + clip
                          if (selectedId == null) selectedId = clip.id
                      }
                  }
              }
          
              private fun videoDuration(uri: Uri): Long {
                  val r = MediaMetadataRetriever()
                  return try {
                      r.setDataSource(getApplication<Application>(), uri)
                      r.extractMetadata(MediaMetadataRetriever.METADATA_KEY_DURATION)?.toLongOrNull() ?: 0L
                  } catch (e: Exception) {
                      0L
                  } finally {
                      r.release()
                  }
              }
          
              fun delete(id: Long) {
                  clips = clips.filter { it.id != id }
                  if (selectedId == id) selectedId = clips.firstOrNull()?.id
              }
          
              fun trim(id: Long, start: Long, end: Long) {
                  if (end - start < 200) return
                  clips = clips.map { if (it.id == id) it.copy(startMs = start, endMs = end) else it }
              }
          
              fun setSpeed(id: Long, speed: Float) {
                  clips = clips.map { if (it.id == id) it.copy(speed = speed) else it }
              }
          
              /** posMs = playhead position inside the selected clip's preview */
              fun split(posMs: Long) {
                  val c = selected ?: return
                  val cut = c.startMs + posMs
                  if (cut - c.startMs < 300 || c.endMs - cut < 300) return
                  val a = c.copy(endMs = cut)
                  val b = c.copy(id = nextId++, startMs = cut)
                  clips = clips.flatMap { if (it.id == c.id) listOf(a, b) else listOf(it) }
                  selectedId = a.id
              }
          
              fun export() {
                  val list = clips
                  if (list.isEmpty()) return
                  val ctx = getApplication<Application>()
                  exportState = ExportState.Running
          
                  val edited = list.map { c ->
                      if (c.isImage) {
                          val d = c.endMs - c.startMs
                          val item = MediaItem.Builder().setUri(c.uri).setImageDurationMs(d).build()
                          EditedMediaItem.Builder(item)
                              .setDurationUs(d * 1000)
                              .setFrameRate(30)
                              .setEffects(Effects(emptyList(), listOf<Effect>(Presentation.createForHeight(1080))))
                              .build()
                      } else {
                          val clipping = MediaItem.ClippingConfiguration.Builder()
                              .setStartPositionMs(c.startMs)
                              .setEndPositionMs(c.endMs)
                              .build()
                          val item = MediaItem.Builder().setUri(c.uri).setClippingConfiguration(clipping).build()
                          val audio = mutableListOf<AudioProcessor>()
                          val video = mutableListOf<Effect>()
                          if (c.speed != 1f) {
                              audio.add(SonicAudioProcessor().apply { setSpeed(c.speed); setPitch(1f) })
                              video.add(SpeedChangeEffect(c.speed))
                          }
                          video
